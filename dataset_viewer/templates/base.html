<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dataset Viewer{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bar-fill { transition: width 0.4s ease; }
        .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
            <a href="/" class="text-lg font-bold text-blue-600 hover:text-blue-800">CountGD Viewer</a>
            {% block breadcrumb %}{% endblock %}
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6 fade-in">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
